<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد كلمات السر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8f3f0;
    --ink: #0e2f2c;
    --muted: #55746f;
    --line: #b9d6d0;
    --card: #ffffff;
    --accent: #d6246e;
    --sym: #0a7f74;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif; line-height: 1.7;
  }
  main { max-width: 560px; margin: 0 auto; padding: 40px 20px 56px; }
  h1 { font-size: clamp(2rem, 7vw, 2.8rem); margin: 0 0 6px; line-height: 1.2; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .display {
    background: var(--card); border: 2px solid var(--ink); border-radius: 16px;
    padding: 26px 16px; direction: ltr; text-align: center;
    font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: clamp(1.4rem, 6vw, 2rem); letter-spacing: .04em;
    word-break: break-all; min-height: 96px;
  }
  .c-l { color: var(--ink); }
  .c-d { color: var(--accent); font-weight: 700; }
  .c-s { color: var(--sym); font-weight: 700; }

  .meter { margin: 16px 0 6px; }
  .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; transition: width .3s, background .3s; }
  .meter-text { display: flex; justify-content: space-between; font-size: .95rem; margin-top: 6px; }

  .actions { display: flex; gap: 10px; margin: 20px 0 28px; }
  button.main, button.alt {
    font: inherit; font-weight: 600; border-radius: 12px; padding: 12px 18px;
    cursor: pointer; border: 2px solid var(--ink); flex: 1;
  }
  button.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.alt { background: transparent; color: var(--ink); }
  button:active { transform: scale(.98); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--card); border-radius: 16px; padding: 20px; border: 2px solid var(--line); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
  .len { direction: ltr; color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 4px 0 18px; }
  label.opt {
    display: flex; align-items: center; gap: 12px; padding: 10px 0;
    border-top: 1px solid var(--line); cursor: pointer;
  }
  label.opt input { width: 20px; height: 20px; accent-color: var(--accent); }
  .ex { margin-inline-start: auto; direction: ltr; color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: .9rem; }
  .note { margin-top: 24px; color: var(--muted); font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>مولّد كلمات السر</h1>
  <p class="sub">كلمة سر عشوائية وقوية في ثانية.</p>

  <div class="display" id="out" aria-live="polite"></div>

  <div class="meter">
    <div class="bar"><span id="fill"></span></div>
    <div class="meter-text"><span>قوة كلمة السر</span><strong id="strength"></strong></div>
  </div>

  <div class="actions">
    <button class="main" id="gen" type="button">ولّد كلمة جديدة</button>
    <button class="alt" id="copy" type="button">نسخ</button>
  </div>

  <section class="panel">
    <div class="row"><span>الطول</span><span class="len" id="lenv">16</span></div>
    <input type="range" id="len" min="8" max="32" value="16" aria-label="طول كلمة السر">
    <label class="opt"><input type="checkbox" id="lower" checked> حروف صغيرة <span class="ex">abc</span></label>
    <label class="opt"><input type="checkbox" id="upper" checked> حروف كبيرة <span class="ex">ABC</span></label>
    <label class="opt"><input type="checkbox" id="digits" checked> أرقام <span class="ex">123</span></label>
    <label class="opt"><input type="checkbox" id="symbols" checked> رموز <span class="ex">#$%</span></label>
  </section>

  <p class="note">كل شيء يحدث داخل متصفحك فقط. كلمة السر لا تُرسل ولا تُحفظ في أي مكان.</p>
</main>

<script>
  var SETS = {
    lower: "abcdefghijklmnopqrstuvwxyz",
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    digits: "0123456789",
    symbols: "!@#$%^&*()-_=+[]{};:,.?"
  };
  var $ = function (id) { return document.getElementById(id); };
  var current = "";

  // رقم عشوائي آمن (بدون انحياز) من 0 إلى n-1
  function rnd(n) {
    var a = new Uint32Array(1);
    var max = Math.floor(4294967296 / n) * n;
    do { crypto.getRandomValues(a); } while (a[0] >= max);
    return a[0] % n;
  }

  function selected() {
    return Object.keys(SETS).filter(function (k) { return $(k).checked; });
  }

  function generate() {
    var keys = selected();
    var length = +$("len").value;
    var pool = keys.map(function (k) { return SETS[k]; }).join("");
    var chars = [];
    // حرف واحد على الأقل من كل نوع مختار
    keys.forEach(function (k) { chars.push(SETS[k][rnd(SETS[k].length)]); });
    while (chars.length < length) chars.push(pool[rnd(pool.length)]);
    // خلط الترتيب
    for (var i = chars.length - 1; i > 0; i--) {
      var j = rnd(i + 1), t = chars[i]; chars[i] = chars[j]; chars[j] = t;
    }
    current = chars.join("");
    show(pool.length, length);
  }

  function show(poolSize, length) {
    var out = $("out");
    out.innerHTML = "";
    current.split("").forEach(function (ch) {
      var s = document.createElement("span");
      s.textContent = ch;
      s.className = SETS.digits.indexOf(ch) > -1 ? "c-d" : (/[a-zA-Z]/.test(ch) ? "c-l" : "c-s");
      out.appendChild(s);
    });
    var bits = length * Math.log2(poolSize);
    var label, color;
    if (bits < 40) { label = "ضعيفة"; color = "#d93025"; }
    else if (bits < 60) { label = "متوسطة"; color = "#e8890c"; }
    else if (bits < 80) { label = "قوية"; color = "#2f9e5a"; }
    else { label = "قوية جدًا"; color = "#0a7f74"; }
    $("strength").textContent = label;
    $("strength").style.color = color;
    $("fill").style.width = Math.min(bits / 100, 1) * 100 + "%";
    $("fill").style.background = color;
    $("copy").textContent = "نسخ";
  }

  function copy() {
    function done() { $("copy").textContent = "تم النسخ ✓"; }
    try {
      navigator.clipboard.writeText(current).then(done, fallback);
    } catch (e) { fallback(); }
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = current; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  $("gen").addEventListener("click", generate);
  $("copy").addEventListener("click", copy);
  $("len").addEventListener("input", function () { $("lenv").textContent = this.value; generate(); });
  Object.keys(SETS).forEach(function (k) {
    $(k).addEventListener("change", function () {
      if (selected().length === 0) { this.checked = true; return; } // لازم نوع واحد على الأقل
      generate();
    });
  });
  generate();
</script>
</body>
</html>
